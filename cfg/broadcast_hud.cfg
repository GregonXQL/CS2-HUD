// CS2 spectator / GOTV / demo: native kill feed and white static crosshair.
// Copy to game/csgo/cfg, then run: exec broadcast_hud
// Restore with: exec broadcast_hud_restore
cl_draw_only_deathnotices 1
cl_drawhud_force_deathnotices 1
cl_drawhud_force_radar -1
cl_drawhud_force_teamid_overhead -1
cl_drawhud_specvote 0
crosshair 1
cl_show_observer_crosshair 0
cl_crosshairstyle 4
cl_crosshair_recoil 0
cl_crosshaircolor 5
cl_crosshaircolor_r 255
cl_crosshaircolor_g 255
cl_crosshaircolor_b 255
cl_crosshairusealpha 1
cl_crosshairalpha 255
cl_crosshairsize 5
cl_crosshairthickness 0.6
cl_crosshairgap -2.2
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_drawoutline 1
cl_crosshair_outlinethickness 1
cl_crosshairgap_useweaponvalue 0
hud_showtargetid 0
cl_showfps 0
cl_hud_telemetry_frametime_show 0
cl_hud_telemetry_ping_show 0
cl_hud_telemetry_net_misdelivery_show 0
cl_hud_telemetry_net_quality_graph_show 0
echo "Broadcast HUD enabled: death notices and larger white static crosshair retained."
