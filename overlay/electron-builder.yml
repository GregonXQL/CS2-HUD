appId: local.cs2.broadcast.overlay
productName: CS2 Broadcast Overlay
directories:
  output: release
files:
  - dist/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: ../backend/dist/CS2BroadcastBackend
    to: backend
  - from: ../frontend/dist
    to: frontend
  - from: build/backend.env
    to: backend.env
  - from: ../cfg
    to: cfg
win:
  target:
    - target: portable
      arch: [x64]
  artifactName: CS2BroadcastOverlay.exe
  signAndEditExecutable: false
